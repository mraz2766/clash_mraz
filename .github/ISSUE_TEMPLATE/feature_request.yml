name: 功能建议
title: '[建议] '
description: 提出 Clash 的使用体验或功能改进建议
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 目前遇到的问题
      description: 说明实际场景，以及现有操作哪里不方便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进
      description: 描述预期交互，可附参考图或可替代方案。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 平台、版本、相关问题或其他信息。

name: 问题反馈
title: '[问题] '
description: 反馈 Clash 的界面、安装或使用问题
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        请先查看本仓库的使用说明和已有问题。描述你实际使用的版本，不要求安装上游测试版。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / macOS，系统架构，Clash 版本
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 写明预期表现与实际表现，可附上截图。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 打开哪个页面、执行什么操作、何时出现问题
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 可从设置中打开日志目录。提交前移除订阅地址、密钥和私人连接信息。
      render: text

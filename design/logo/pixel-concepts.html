<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Logo Concepts</title>
<style>
  :root { --bg: #f5f5f4; --text: #1c1c1e; --muted: #6b6b70; --line: #e3e3e1; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif; padding: 40px 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 32px; max-width: 760px; }
  .concept { display: grid; grid-template-columns: 220px 220px 1fr; gap: 24px; align-items: center; padding: 24px 0; border-top: 1px solid var(--line); }
  .meta h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .meta p { margin: 0 0 14px; color: var(--muted); max-width: 440px; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; }
  .sizes span { display: block; text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
  svg { display: block; shape-rendering: crispEdges; image-rendering: pixelated; }
  .grid-toggle { margin-bottom: 8px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<h1>Clash · 像素 Logo 方案</h1>
<p class="lead">16×16 像素网格，每个像素都落在格子上，单色强调色，无抗锯齿。16px 时一个设计像素正好是一个屏幕像素，托盘里最清晰；放大时只按整数倍缩放。左为浅色、中为深色并显示网格，右侧为 64 / 32 / 16px 实际尺寸。</p>
<div id="list"></div>

<script>
  // '#' = mark pixel. Every row is exactly 16 cells.
  const concepts = [
    {
      name: '方案一 · 像素环流',
      desc: '把现在的「环流」逐像素重绘：按像素圆规则栅格化的 2 像素圆环，右上开口，2×2 节点停在缺口里，与两端各留 2 像素空隙。和现有品牌一脉相承，适合作为托盘与小尺寸的像素版本。',
      rows: [
        '................',
        '................',
        '.....####.......',
        '....#####..##...',
        '...###.....##...',
        '..###...........',
        '..##............',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..###......###..',
        '...###....###...',
        '....########....',
        '.....######.....',
        '................',
        '................',
      ],
    },
    {
      name: '方案二 · 方环',
      desc: '最“像素原生”的形态：2 像素粗的方环，外角各削去一个像素，右上角打开，节点停在角上，两侧缺口等宽。全部是横竖线，没有锯齿，任何整数倍缩放都完全锐利。',
      rows: [
        '................',
        '................',
        '...#######..##..',
        '..########..##..',
        '..##............',
        '..##............',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..############..',
        '...##########...',
        '................',
        '................',
      ],
    },
    {
      name: '方案三 · 像素环流 · 反白',
      invert: true,
      desc: '与方案一同一像素图形，改为强调色底板配白色像素。图标在桌面和任务栏上存在感最强，托盘仍可使用方案一的浅色版本。',
      rows: [
        '................',
        '................',
        '.....####.......',
        '....#####..##...',
        '...###.....##...',
        '..###...........',
        '..##............',
        '..##........##..',
        '..##........##..',
        '..##........##..',
        '..###......###..',
        '...###....###...',
        '....########....',
        '.....######.....',
        '................',
        '................',
      ],
    },
  ]
  const themes = { light: { tile: '#ffffff', ink: '#005FB8' }, dark: { tile: '#1c1c1e', ink: '#60CDFF' } }

  const make = (rows, theme, size, grid = false, invert = false) => {
    const t = invert ? { tile: themes[theme].ink === '#60CDFF' ? '#0B4F8A' : '#005FB8', ink: '#ffffff' } : themes[theme]
    const ns = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(ns, 'svg')
    svg.setAttribute('viewBox', '0 0 16 16')
    svg.setAttribute('width', size)
    svg.setAttribute('height', size)
    const tile = document.createElementNS(ns, 'rect')
    tile.setAttribute('width', 16); tile.setAttribute('height', 16)
    tile.setAttribute('rx', 3.5); tile.setAttribute('fill', t.tile)
    svg.append(tile)
    rows.forEach((row, y) => [...row].forEach((cell, x) => {
      if (cell !== '#') return
      const px = document.createElementNS(ns, 'rect')
      px.setAttribute('x', x); px.setAttribute('y', y)
      px.setAttribute('width', 1); px.setAttribute('height', 1)
      px.setAttribute('fill', t.ink)
      svg.append(px)
    }))
    if (grid) {
      for (let i = 1; i < 16; i++) {
        for (const [x1, y1, x2, y2] of [[i, 0, i, 16], [0, i, 16, i]]) {
          const l = document.createElementNS(ns, 'line')
          Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v))
          l.setAttribute('stroke', theme === 'dark' ? '#ffffff14' : '#00000010')
          l.setAttribute('stroke-width', 0.04)
          svg.append(l)
        }
      }
    }
    return svg
  }

  const list = document.getElementById('list')
  for (const c of concepts) {
    if (c.rows.some((row) => row.length !== 16) || c.rows.length !== 16) console.error('Grid must be 16×16:', c.name)
    const row = document.createElement('section')
    row.className = 'concept'
    const meta = document.createElement('div')
    meta.className = 'meta'
    meta.innerHTML = `<h2>${c.name}</h2><p>${c.desc}</p><div class="sizes"></div>`
    for (const s of [64, 32, 16]) {
      const wrap = document.createElement('div')
      wrap.append(make(c.rows, 'light', s, false, c.invert))
      wrap.insertAdjacentHTML('beforeend', `<span>${s}px</span>`)
      meta.querySelector('.sizes').append(wrap)
    }
    row.append(make(c.rows, 'light', 208, false, c.invert), make(c.rows, 'dark', 208, true, c.invert), meta)
    list.append(row)
  }
</script>
</body>
</html>
